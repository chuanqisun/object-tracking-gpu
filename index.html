<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YOLO26 Inference Console</title>
    <style>
      :root {
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --border: #ddd;
        --bg: #fff;
        --fg: #111;
        --muted: #666;
        --gap: 0.5rem;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-sans);
        font-size: 12px;
        color: var(--fg);
        background: var(--bg);
        padding: var(--gap);
        line-height: 1.4;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.25rem;
        margin-bottom: var(--gap);
      }

      h1 {
        font-size: 13px;
        font-weight: 600;
      }

      .status-indicator {
        font-family: var(--font-mono);
        font-weight: 600;
        font-size: 11px;
      }

      .layout {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        gap: var(--gap);
        align-items: start;
      }

      @media (max-width: 768px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .layout > .viewport-column {
          order: -1;
        }
      }

      .sidebar,
      .viewport-column {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
      }

      fieldset {
        border: 1px solid var(--border);
        padding: 0.35rem 0.45rem;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }

      legend {
        font-size: 10px;
        font-weight: 600;
        padding: 0 0.2rem;
        color: var(--muted);
        text-transform: uppercase;
      }

      .row {
        display: flex;
        gap: 0.3rem;
        align-items: center;
      }

      .row > * {
        flex: 1;
      }

      label {
        font-size: 11px;
        display: flex;
        justify-content: space-between;
      }

      input[type="text"],
      select,
      button {
        font-family: inherit;
        font-size: 11px;
        padding: 2px 4px;
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 2px;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2px;
        font-family: var(--font-mono);
        text-align: center;
      }

      .metric-box {
        border: 1px solid var(--border);
        padding: 2px;
      }

      .metric-label {
        font-size: 9px;
        color: var(--muted);
        display: block;
      }

      .metric-val {
        font-size: 11px;
        font-weight: 600;
      }

      #logPanel {
        font-family: var(--font-mono);
        font-size: 10px;
        height: 60px;
        border: 1px solid var(--border);
        padding: 3px;
        overflow-y: auto;
        white-space: pre-wrap;
        background: #fafafa;
      }

      .detections-table-container {
        max-height: 120px;
        overflow-y: auto;
        border: 1px solid var(--border);
      }

      .detections-table {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--font-mono);
        font-size: 10px;
      }

      .detections-table th {
        background: #f5f5f5;
        text-align: left;
        padding: 2px 4px;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
      }

      .detections-table tr:not(:last-child) {
        border-bottom: 1px solid #f0f0f0;
      }

      .detections-table td {
        padding: 2px 4px;
      }

      .viewport-container {
        border: 1px solid var(--border);
        background: #000;
        width: 100%;
        max-width: 640px;
        aspect-ratio: 1 / 1;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      video {
        display: none;
      }

      canvas#outputCanvas {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>YOLO26 Console</h1>
      <div id="statusIndicator" class="status-indicator">[DISCONNECTED]</div>
    </header>

    <main class="layout">
      <div class="sidebar">
        <fieldset>
          <legend>Server</legend>
          <input type="text" id="wsUrl" placeholder="ws://localhost:18888/ws" />
          <div class="row">
            <button id="connectBtn">Connect</button>
            <button id="disconnectBtn" disabled>Disconnect</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Camera</legend>
          <div class="row">
            <select id="cameraSelect">
              <option value="">-- Scan Devices --</option>
            </select>
            <button id="refreshCameras" style="flex: 0 0 auto">Scan</button>
          </div>
          <div class="row">
            <button id="startCamBtn" disabled>Start</button>
            <button id="stopCamBtn" disabled>Stop</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Parameters</legend>
          <label for="confThres">
            <span>Confidence Threshold</span>
            <span id="confValue" style="font-family: var(--font-mono)">0.25</span>
          </label>
          <input type="range" id="confThres" min="0.05" max="0.95" step="0.05" value="0.25" />
        </fieldset>

        <fieldset>
          <legend>Metrics</legend>
          <div class="metrics-grid">
            <div class="metric-box">
              <span class="metric-label">FPS</span>
              <span class="metric-val" id="fpsStat">0.0</span>
            </div>
            <div class="metric-box">
              <span class="metric-label">INFER</span>
              <span class="metric-val" id="inferStat">0ms</span>
            </div>
            <div class="metric-box">
              <span class="metric-label">RTT</span>
              <span class="metric-val" id="rttStat">0ms</span>
            </div>
            <div class="metric-box">
              <span class="metric-label">COUNT</span>
              <span class="metric-val" id="detCountStat">0</span>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Logs</legend>
          <div id="logPanel">Ready.</div>
        </fieldset>

        <fieldset>
          <legend>Detections</legend>
          <div class="detections-table-container">
            <table class="detections-table">
              <thead>
                <tr>
                  <th>Class</th>
                  <th style="text-align: right">Score</th>
                  <th style="text-align: right">BBox</th>
                </tr>
              </thead>
              <tbody id="detectionsList">
                <tr>
                  <td colspan="3" style="color: var(--muted)">No active stream</td>
                </tr>
              </tbody>
            </table>
          </div>
        </fieldset>
      </div>

      <div class="viewport-column">
        <div class="viewport-container">
          <video id="webcam" playsinline muted></video>
          <canvas id="outputCanvas" width="640" height="640"></canvas>
        </div>
      </div>
    </main>

    <script>
      const CLASS_NAMES = { 0: "blue puck", 1: "pink puck" };
      const CLASS_COLORS = { 0: "#0066ff", 1: "#ff007f" };

      function getClassColor(classId) {
        return CLASS_COLORS[classId] || `hsl(${(classId * 137) % 360}, 100%, 50%)`;
      }

      // DOM Elements
      const wsUrlInput = document.getElementById("wsUrl");
      const connectBtn = document.getElementById("connectBtn");
      const disconnectBtn = document.getElementById("disconnectBtn");
      const cameraSelect = document.getElementById("cameraSelect");
      const refreshCamerasBtn = document.getElementById("refreshCameras");
      const startCamBtn = document.getElementById("startCamBtn");
      const stopCamBtn = document.getElementById("stopCamBtn");
      const confThresInput = document.getElementById("confThres");
      const confValueLabel = document.getElementById("confValue");

      const statusIndicator = document.getElementById("statusIndicator");
      const fpsStat = document.getElementById("fpsStat");
      const inferStat = document.getElementById("inferStat");
      const rttStat = document.getElementById("rttStat");
      const detCountStat = document.getElementById("detCountStat");
      const detectionsList = document.getElementById("detectionsList");
      const logPanel = document.getElementById("logPanel");

      const video = document.getElementById("webcam");
      const canvas = document.getElementById("outputCanvas");
      const ctx = canvas.getContext("2d");

      const offscreenCanvas = document.createElement("canvas");
      offscreenCanvas.width = 640;
      offscreenCanvas.height = 640;
      const offscreenCtx = offscreenCanvas.getContext("2d");

      let ws = null;
      let mediaStream = null;
      let isStreaming = false;
      let isFrameInFlight = false;
      let frameSentTime = 0;
      let frameCount = 0;
      let fpsInterval = performance.now();

      // Initial Canvas State
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#666666";
      ctx.font = "11px monospace";
      ctx.textAlign = "center";
      ctx.fillText("NO SIGNAL", canvas.width / 2, canvas.height / 2);

      // Auto-configure WebSocket URL
      const defaultProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const defaultPort = "18888";
      let host = window.location.hostname || "localhost";
      wsUrlInput.value =
        window.location.protocol.startsWith("http") && window.location.port === defaultPort
          ? `${defaultProtocol}//${window.location.host}/ws`
          : `${defaultProtocol}//${host}:${defaultPort}/ws`;

      function log(msg) {
        const time = new Date().toTimeString().split(" ")[0];
        logPanel.textContent += `[${time}] ${msg}\n`;
        logPanel.scrollTop = logPanel.scrollHeight;
      }

      function updateStatus(stateText) {
        statusIndicator.textContent = `[${stateText.toUpperCase()}]`;
      }

      async function scanCameras() {
        try {
          if (!mediaStream && cameraSelect.options.length <= 1) {
            try {
              const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
              tempStream.getTracks().forEach((track) => track.stop());
            } catch (e) {}
          }

          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter((d) => d.kind === "videoinput");

          cameraSelect.innerHTML = "";
          if (videoDevices.length === 0) {
            cameraSelect.innerHTML = '<option value="">No cameras found</option>';
            startCamBtn.disabled = true;
            return;
          }

          videoDevices.forEach((device, index) => {
            const option = document.createElement("option");
            option.value = device.deviceId;
            option.textContent = device.label || `Camera ${index + 1}`;
            cameraSelect.appendChild(option);
          });

          startCamBtn.disabled = false;
          log(`Found ${videoDevices.length} camera(s).`);
        } catch (err) {
          log(`Scan error: ${err.message}`);
        }
      }

      async function startCamera() {
        const deviceId = cameraSelect.value;
        const constraints = {
          video: deviceId
            ? { deviceId: { exact: deviceId }, width: { ideal: 640 }, height: { ideal: 640 }, frameRate: { ideal: 60 } }
            : { width: { ideal: 640 }, height: { ideal: 640 }, frameRate: { ideal: 60 } },
        };

        try {
          if (mediaStream) stopCamera();
          mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = mediaStream;
          await video.play();

          isStreaming = true;
          startCamBtn.disabled = true;
          stopCamBtn.disabled = false;
          cameraSelect.disabled = true;
          log("Camera started.");

          if (ws && ws.readyState === WebSocket.OPEN) {
            sendNextFrame();
          }
        } catch (err) {
          log(`Camera error: ${err.message}`);
        }
      }

      function stopCamera() {
        isStreaming = false;
        if (mediaStream) {
          mediaStream.getTracks().forEach((t) => t.stop());
          mediaStream = null;
        }
        video.srcObject = null;
        startCamBtn.disabled = false;
        stopCamBtn.disabled = true;
        cameraSelect.disabled = false;
        log("Camera stopped.");

        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#666666";
        ctx.font = "11px monospace";
        ctx.textAlign = "center";
        ctx.fillText("NO SIGNAL", canvas.width / 2, canvas.height / 2);
      }

      function connectWebSocket() {
        const url = wsUrlInput.value.trim();
        if (!url) return;

        log(`Connecting to ${url}...`);
        updateStatus("connecting");
        connectBtn.disabled = true;

        try {
          ws = new WebSocket(url);
          ws.binaryType = "arraybuffer";

          ws.onopen = () => {
            updateStatus("connected");
            log("Connected.");
            connectBtn.disabled = true;
            disconnectBtn.disabled = false;
            if (isStreaming) sendNextFrame();
          };

          ws.onclose = (evt) => {
            updateStatus("disconnected");
            log(`Disconnected (${evt.code})`);
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
            ws = null;
            isFrameInFlight = false;
          };

          ws.onerror = () => {
            updateStatus("error");
            log("WS error.");
          };

          ws.onmessage = (event) => {
            const now = performance.now();
            const rtt = Math.round(now - frameSentTime);
            isFrameInFlight = false;

            try {
              handleInferenceResult(JSON.parse(event.data), rtt);
            } catch (e) {
              log(`Parse err: ${e.message}`);
            }

            if (isStreaming) sendNextFrame();
          };
        } catch (e) {
          log(`Init error: ${e.message}`);
          updateStatus("error");
          connectBtn.disabled = false;
        }
      }

      function disconnectWebSocket() {
        if (ws) ws.close();
      }

      function sendNextFrame() {
        if (!isStreaming || !ws || ws.readyState !== WebSocket.OPEN || isFrameInFlight) return;
        if (video.readyState < 2) {
          setTimeout(sendNextFrame, 10);
          return;
        }

        isFrameInFlight = true;
        frameSentTime = performance.now();

        offscreenCtx.drawImage(video, 0, 0, offscreenCanvas.width, offscreenCanvas.height);
        offscreenCanvas.toBlob(
          (blob) => {
            if (!blob || !ws || ws.readyState !== WebSocket.OPEN) {
              isFrameInFlight = false;
              return;
            }
            ws.send(blob);
          },
          "image/jpeg",
          0.75,
        );
      }

      function handleInferenceResult(data, rtt) {
        frameCount++;
        const now = performance.now();
        if (now - fpsInterval >= 1000) {
          fpsStat.textContent = ((frameCount * 1000) / (now - fpsInterval)).toFixed(1);
          frameCount = 0;
          fpsInterval = now;
        }

        inferStat.textContent = `${(data.infer_ms || 0).toFixed(1)}ms`;
        rttStat.textContent = `${rtt}ms`;

        const confThres = parseFloat(confThresInput.value);
        const filteredDetections = (data.detections || []).filter((d) => d.score >= confThres);
        detCountStat.textContent = filteredDetections.length;

        const targetW = video.videoWidth || 640;
        const targetH = video.videoHeight || 640;
        if (canvas.width !== targetW) canvas.width = targetW;
        if (canvas.height !== targetH) canvas.height = targetH;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const scaleX = canvas.width / (data.target_size || 640);
        const scaleY = canvas.height / (data.target_size || 640);

        filteredDetections.forEach((det) => {
          let [x1, y1, x2, y2] = det.box;
          if (x2 < x1 || y2 < y1) {
            const cx = x1,
              cy = y1,
              w = x2,
              h = y2;
            x1 = cx - w / 2;
            y1 = cy - h / 2;
            x2 = cx + w / 2;
            y2 = cy + h / 2;
          }

          const boxX = x1 * scaleX;
          const boxY = y1 * scaleY;
          const boxW = (x2 - x1) * scaleX;
          const boxH = (y2 - y1) * scaleY;

          const color = getClassColor(det.class_id);
          const label = `${(det.score * 100).toFixed(0)}%`;

          // Draw Bounding Box
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.5;
          ctx.strokeRect(boxX, boxY, boxW, boxH);

          // Draw Score Text directly (no label background, matching color)
          ctx.font = "11px monospace";
          ctx.fillStyle = color;
          ctx.textAlign = "left";
          const textY = boxY > 12 ? boxY - 3 : boxY + 12;
          ctx.fillText(label, boxX + 1, textY);
        });

        renderDetectionsList(filteredDetections);
      }

      function renderDetectionsList(detections) {
        if (detections.length === 0) {
          detectionsList.innerHTML = '<tr><td colspan="3" style="color: var(--muted)">0 objects</td></tr>';
          return;
        }
        detectionsList.innerHTML = detections
          .map((det) => {
            const name = CLASS_NAMES[det.class_id] || `id:${det.class_id}`;
            const boxStr = det.box ? det.box.map((v) => Math.round(v)).join(",") : "-";
            return `
              <tr>
                <td>${name}</td>
                <td style="text-align: right">${(det.score * 100).toFixed(1)}%</td>
                <td style="text-align: right; color: var(--muted)">[${boxStr}]</td>
              </tr>`;
          })
          .join("");
      }

      confThresInput.addEventListener("input", (e) => {
        confValueLabel.textContent = e.target.value;
      });

      connectBtn.addEventListener("click", connectWebSocket);
      disconnectBtn.addEventListener("click", disconnectWebSocket);
      refreshCamerasBtn.addEventListener("click", scanCameras);
      startCamBtn.addEventListener("click", startCamera);
      stopCamBtn.addEventListener("click", stopCamera);

      scanCameras();
    </script>
  </body>
</html>
