<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaPipe Hand Tracking Console</title>
    <style>
      :root {
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --border: #ddd;
        --border-soft: #f0f0f0;
        --bg: #fff;
        --bg-panel: #fafafa;
        --bg-head: #f5f5f5;
        --fg: #111;
        --muted: #666;
        --gap: 0.5rem;
        --radius: 2px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-sans);
        font-size: 12px;
        color: var(--fg);
        background: var(--bg);
        padding: var(--gap);
        line-height: 1.4;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.25rem;
        margin-bottom: var(--gap);

        h1 {
          font-size: 13px;
          font-weight: 600;
        }

        .status-indicator {
          font-family: var(--font-mono);
          font-weight: 600;
          font-size: 11px;
        }
      }

      .layout {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        gap: var(--gap);
        align-items: start;

        @media (max-width: 768px) {
          grid-template-columns: 1fr;

          > .viewport-column {
            order: -1;
          }
        }
      }

      .sidebar,
      .viewport-column {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
      }

      fieldset {
        border: 1px solid var(--border);
        padding: 0.35rem 0.45rem;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;

        legend {
          font-size: 10px;
          font-weight: 600;
          padding: 0 0.2rem;
          color: var(--muted);
          text-transform: uppercase;
        }
      }

      .row {
        display: flex;
        gap: 0.3rem;
        align-items: center;

        > * {
          flex: 1;
        }
      }

      label {
        font-size: 11px;
        display: flex;
        justify-content: space-between;
      }

      input[type="text"],
      select,
      button {
        font-family: inherit;
        font-size: 11px;
        padding: 2px 4px;
        border: 1px solid var(--border);
        background: var(--bg);
        border-radius: var(--radius);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2px;
        font-family: var(--font-mono);
        text-align: center;

        .metric-box {
          border: 1px solid var(--border);
          padding: 2px;
        }

        .metric-label {
          font-size: 9px;
          color: var(--muted);
          display: block;
        }

        .metric-val {
          font-size: 11px;
          font-weight: 600;
        }
      }

      #logPanel {
        font-family: var(--font-mono);
        font-size: 10px;
        height: 60px;
        border: 1px solid var(--border);
        padding: 3px;
        overflow-y: auto;
        white-space: pre-wrap;
        background: var(--bg-panel);
      }

      .detections-table-container {
        max-height: 120px;
        overflow-y: auto;
        border: 1px solid var(--border);

        table {
          width: 100%;
          border-collapse: collapse;
          font-family: var(--font-mono);
          font-size: 10px;

          th {
            background: var(--bg-head);
            text-align: left;
            padding: 2px 4px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
          }

          tr:not(:last-child) {
            border-bottom: 1px solid var(--border-soft);
          }

          td {
            padding: 2px 4px;
          }
        }
      }

      .viewport-container {
        border: 1px solid var(--border);
        background: #000;
        width: 100%;
        max-width: 640px;
        aspect-ratio: 1 / 1;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;

        video {
          display: none;
        }

        canvas {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: contain;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>MediaPipe Hand Tracking Console</h1>
      <div id="statusIndicator" class="status-indicator">[INITIALIZING]</div>
    </header>

    <main class="layout">
      <div class="sidebar">
        <fieldset>
          <legend>Model</legend>
          <div class="row">
            <button id="reloadModelBtn">Reload Model</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Camera</legend>
          <div class="row">
            <select id="cameraSelect">
              <option value="">-- Scan Devices --</option>
            </select>
            <button id="refreshCamerasBtn" style="flex: 0 0 auto">Scan</button>
          </div>
          <div class="row">
            <button id="startCamBtn" disabled>Start</button>
            <button id="stopCamBtn" disabled>Stop</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Parameters</legend>
          <label for="confThres">
            <span>Confidence Threshold</span>
            <span id="confValue" style="font-family: var(--font-mono)">0.50</span>
          </label>
          <input type="range" id="confThres" min="0.05" max="0.95" step="0.05" value="0.50" />
        </fieldset>

        <fieldset>
          <legend>Metrics</legend>
          <div class="metrics-grid">
            <div class="metric-box"><span class="metric-label">CAM FPS</span><span class="metric-val" id="camFpsStat">0.0</span></div>
            <div class="metric-box"><span class="metric-label">INF FPS</span><span class="metric-val" id="fpsStat">0.0</span></div>
            <div class="metric-box"><span class="metric-label">INFER</span><span class="metric-val" id="inferStat">0ms</span></div>
            <div class="metric-box"><span class="metric-label">SKIPPED</span><span class="metric-val" id="skipStat">0</span></div>
            <div class="metric-box"><span class="metric-label">COUNT</span><span class="metric-val" id="detCountStat">0</span></div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Logs</legend>
          <div id="logPanel">Ready.</div>
        </fieldset>

        <fieldset>
          <legend>Index Fingertips</legend>
          <div class="detections-table-container">
            <table>
              <thead>
                <tr>
                  <th>Hand</th>
                  <th style="text-align: right">Score</th>
                  <th style="text-align: right">Position (X, Y)</th>
                </tr>
              </thead>
              <tbody id="detectionsList">
                <tr>
                  <td colspan="3" style="color: var(--muted)">No active stream</td>
                </tr>
              </tbody>
            </table>
          </div>
        </fieldset>
      </div>

      <div class="viewport-column">
        <div class="viewport-container">
          <video id="webcam" playsinline muted></video>
          <canvas id="outputCanvas" width="640" height="640"></canvas>
        </div>
      </div>
    </main>

    <script type="module">
      import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

      // Landmark index 8 corresponds to the tip of the index finger
      const INDEX_FINGER_TIP = 8;
      const HAND_COLORS = {
        Left: "#0066ff", // Blue (same style as blue puck)
        Right: "#ff007f", // Pink (same style as pink puck)
      };

      const $ = (id) => document.getElementById(id);
      const el = {
        reloadModelBtn: $("reloadModelBtn"),
        cameraSelect: $("cameraSelect"),
        refreshCamerasBtn: $("refreshCamerasBtn"),
        startCamBtn: $("startCamBtn"),
        stopCamBtn: $("stopCamBtn"),
        confThres: $("confThres"),
        confValue: $("confValue"),
        status: $("statusIndicator"),
        camFps: $("camFpsStat"),
        fps: $("fpsStat"),
        infer: $("inferStat"),
        skip: $("skipStat"),
        detCount: $("detCountStat"),
        detectionsList: $("detectionsList"),
        logPanel: $("logPanel"),
        video: $("webcam"),
        canvas: $("outputCanvas"),
      };

      const ctx = el.canvas.getContext("2d");

      // ---------- State ----------
      let handLandmarker = null;
      let mediaStream = null;
      let isStreaming = false;
      let isInferencing = false;
      let lastVideoTime = -1;

      let frameCount = 0;
      let fpsWindowStart = performance.now();

      let camFrameCount = 0;
      let camFpsWindowStart = performance.now();
      let skippedFrames = 0;

      // ---------- MediaPipe Initialization ----------
      async function initMediaPipe() {
        setStatus("loading");
        log("Loading MediaPipe Hand Landmarker...");
        try {
          const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");

          handLandmarker = await HandLandmarker.createFromOptions(vision, {
            baseOptions: {
              modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
              delegate: "GPU",
            },
            runningMode: "VIDEO",
            numHands: 2,
            minHandDetectionConfidence: parseFloat(el.confThres.value),
            minHandPresenceConfidence: parseFloat(el.confThres.value),
            minTrackingConfidence: 0.5,
          });

          setStatus("ready");
          log("MediaPipe Hand Landmarker ready.");
        } catch (err) {
          setStatus("error");
          log(`Failed to init MediaPipe: ${err.message}`);
        }
      }

      async function updateConfidenceThreshold(val) {
        if (!handLandmarker) return;
        try {
          await handLandmarker.setOptions({
            minHandDetectionConfidence: val,
            minHandPresenceConfidence: val,
          });
        } catch (err) {
          log(`Error setting options: ${err.message}`);
        }
      }

      // ---------- Camera ----------
      async function scanCameras() {
        try {
          if (!mediaStream && el.cameraSelect.options.length <= 1) {
            try {
              const temp = await navigator.mediaDevices.getUserMedia({ video: true });
              temp.getTracks().forEach((t) => t.stop());
            } catch {}
          }

          const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");

          if (devices.length === 0) {
            el.cameraSelect.innerHTML = '<option value="">No cameras found</option>';
            el.startCamBtn.disabled = true;
            return;
          }

          el.cameraSelect.innerHTML = devices.map((d, i) => `<option value="${d.deviceId}">${d.label || `Camera ${i + 1}`}</option>`).join("");
          el.startCamBtn.disabled = !handLandmarker;
          log(`Found ${devices.length} camera(s).`);
        } catch (err) {
          log(`Scan error: ${err.message}`);
        }
      }

      async function startCamera() {
        const deviceId = el.cameraSelect.value;
        const video = {
          ...(deviceId && { deviceId: { exact: deviceId } }),
          width: { ideal: 640 },
          height: { ideal: 640 },
          frameRate: { ideal: 60 },
        };

        try {
          if (mediaStream) stopCamera();
          mediaStream = await navigator.mediaDevices.getUserMedia({ video });
          el.video.srcObject = mediaStream;
          await el.video.play();

          isStreaming = true;
          setCameraControls(true);
          setStatus("running");
          log("Camera started.");
          startCaptureLoop();
        } catch (err) {
          log(`Camera error: ${err.message}`);
          setStatus("error");
        }
      }

      function stopCamera() {
        isStreaming = false;
        mediaStream?.getTracks().forEach((t) => t.stop());
        mediaStream = null;
        el.video.srcObject = null;
        setCameraControls(false);
        setStatus("ready");
        log("Camera stopped.");
        drawNoSignal();
        renderDetectionsList([]);
      }

      // ---------- Inference & Loop ----------
      function startCaptureLoop() {
        const onFrame = () => {
          if (!isStreaming) return;
          updateCamFps();
          runInference();
          scheduleNext();
        };

        const scheduleNext = () => {
          if (!isStreaming) return;
          if (el.video.requestVideoFrameCallback) {
            el.video.requestVideoFrameCallback(onFrame);
          } else {
            requestAnimationFrame(onFrame);
          }
        };

        scheduleNext();
      }

      function runInference() {
        if (!isStreaming || !handLandmarker || el.video.readyState < 2) return;

        if (isInferencing) {
          skippedFrames++;
          el.skip.textContent = skippedFrames;
          return;
        }

        if (el.video.currentTime === lastVideoTime) return;
        lastVideoTime = el.video.currentTime;

        isInferencing = true;
        const start = performance.now();

        try {
          const results = handLandmarker.detectForVideo(el.video, performance.now());
          const inferDuration = performance.now() - start;
          handleLandmarkResult(results, inferDuration);
        } catch (e) {
          log(`Inference err: ${e.message}`);
        } finally {
          isInferencing = false;
        }
      }

      function handleLandmarkResult(results, inferDuration) {
        updateFps();
        el.infer.textContent = `${inferDuration.toFixed(1)}ms`;

        const targetW = el.video.videoWidth || 640;
        const targetH = el.video.videoHeight || 640;
        if (el.canvas.width !== targetW) el.canvas.width = targetW;
        if (el.canvas.height !== targetH) el.canvas.height = targetH;

        // Draw webcam feed onto canvas
        ctx.drawImage(el.video, 0, 0, el.canvas.width, el.canvas.height);

        const detections = [];
        const confThres = parseFloat(el.confThres.value);

        if (results.landmarks && results.landmarks.length > 0) {
          results.landmarks.forEach((landmarks, index) => {
            const handedness = results.handednesses?.[index]?.[0];
            const label = handedness?.categoryName || (index === 0 ? "Left" : "Right");
            const score = handedness?.score ?? 1.0;

            if (score >= confThres && landmarks[INDEX_FINGER_TIP]) {
              const tip = landmarks[INDEX_FINGER_TIP];
              const x = tip.x * el.canvas.width;
              const y = tip.y * el.canvas.height;

              detections.push({
                hand: label,
                score: score,
                x: x,
                y: y,
              });

              drawIndexFingerTip(x, y, label, score);
            }
          });
        }

        el.detCount.textContent = detections.length;
        renderDetectionsList(detections);
      }

      // ---------- Rendering ----------
      function drawIndexFingerTip(x, y, handLabel, score) {
        const color = HAND_COLORS[handLabel] || "#00ff00";

        // Small solid circle at the index fingertip
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, 2 * Math.PI);
        ctx.fillStyle = color;
        ctx.fill();

        // Confidence score label in the same style
        ctx.font = "11px monospace";
        ctx.fillStyle = color;
        ctx.textAlign = "left";
        ctx.fillText(`${handLabel} ${(score * 100).toFixed(0)}%`, x + 8, y > 12 ? y - 3 : y + 12);
      }

      function renderDetectionsList(detections) {
        el.detectionsList.innerHTML =
          detections.length === 0
            ? '<tr><td colspan="3" style="color: var(--muted)">0 detected</td></tr>'
            : detections
                .map(
                  ({ hand, score, x, y }) => `
                    <tr>
                      <td style="color: ${HAND_COLORS[hand] || "inherit"}">${hand} Index</td>
                      <td style="text-align: right">${(score * 100).toFixed(1)}%</td>
                      <td style="text-align: right; color: var(--muted)">[${Math.round(x)}, ${Math.round(y)}]</td>
                    </tr>`,
                )
                .join("");
      }

      function drawNoSignal() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, el.canvas.width, el.canvas.height);
        ctx.fillStyle = "#666";
        ctx.font = "11px monospace";
        ctx.textAlign = "center";
        ctx.fillText("NO SIGNAL", el.canvas.width / 2, el.canvas.height / 2);
      }

      // ---------- Metric Trackers ----------
      function updateFps() {
        frameCount++;
        const now = performance.now();
        if (now - fpsWindowStart >= 1000) {
          el.fps.textContent = ((frameCount * 1000) / (now - fpsWindowStart)).toFixed(1);
          frameCount = 0;
          fpsWindowStart = now;
        }
      }

      function updateCamFps() {
        camFrameCount++;
        const now = performance.now();
        if (now - camFpsWindowStart >= 1000) {
          el.camFps.textContent = ((camFrameCount * 1000) / (now - camFpsWindowStart)).toFixed(1);
          camFrameCount = 0;
          camFpsWindowStart = now;
        }
      }

      // ---------- Pure Helpers ----------
      const setStatus = (state) => (el.status.textContent = `[${state.toUpperCase()}]`);

      const setCameraControls = (running) => {
        el.startCamBtn.disabled = running;
        el.stopCamBtn.disabled = !running;
        el.cameraSelect.disabled = running;
      };

      const log = (msg) => {
        const time = new Date().toTimeString().split(" ")[0];
        el.logPanel.textContent += `[${time}] ${msg}\n`;
        el.logPanel.scrollTop = el.logPanel.scrollHeight;
      };

      // ---------- Init ----------
      drawNoSignal();

      el.confThres.addEventListener("input", ({ target }) => {
        el.confValue.textContent = target.value;
        updateConfidenceThreshold(parseFloat(target.value));
      });

      el.reloadModelBtn.addEventListener("click", initMediaPipe);
      el.refreshCamerasBtn.addEventListener("click", scanCameras);
      el.startCamBtn.addEventListener("click", startCamera);
      el.stopCamBtn.addEventListener("click", stopCamera);

      (async () => {
        await initMediaPipe();
        await scanCameras();
      })();
    </script>
  </body>
</html>
